name: 🏗️ Architecture Change Request
description: Propose a structural/architectural change (models, contracts, modules, workflow truth, tenancy, printing, infra)
title: "[ARCH] <short descriptive title>"
labels: ["architecture"]
assignees: []
body:

  - type: dropdown
    id: change_type
    attributes:
      label: Change Type
      options:
        - Domain model / DB schema
        - Workflow / State machine
        - Contract-first / OpenAPI / SDK generation
        - Multi-tenancy / Tenant isolation
        - PDF pipeline / Deterministic rendering
        - Background jobs / Worker / Queue
        - Infra / Docker / Caddy / Networking
        - Observability / Logging / Metrics
        - Security boundary / Permissions / AuthN/AuthZ
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: Risk Level
      description: Impact to production stability or data integrity
      options:
        - 🔴 High (data integrity / breaking change / cross-module)
        - 🟠 Medium (localized but could ripple)
        - 🟡 Low (safe refactor / internal only)
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement
      description: What architectural problem are we solving? Be concrete.
      placeholder: |
        Example:
        Order status is stored per-stage and diverges between pages (Samples vs Results vs Verification).
        We need a single global truth status model.
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State
      description: Describe how the system behaves today (with file paths/modules if known).
      placeholder: |
        - Where is the state stored?
        - Which modules read/write it?
        - What are the failure modes?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution (High-Level)
      description: Outline the target architecture and key decisions.
      placeholder: |
        Example:
        - Introduce Order.status as the single truth.
        - All workflows transition Order.status via a shared service.
        - Stage pages derive status from Order.status only.
        - Add audit log for transitions.
    validations:
      required: true

  - type: textarea
    id: contract_impact
    attributes:
      label: Contract / API Impact
      description: Specify OpenAPI changes, versioning, and SDK regeneration impact.
      placeholder: |
        - New/changed endpoints?
        - Response schema changes?
        - Backward compatibility needed? (yes/no + why)
        - Migration plan for clients
    validations:
      required: true

  - type: textarea
    id: data_migration
    attributes:
      label: Data Migration Plan
      description: If schema/state changes, how will data be migrated safely?
      placeholder: |
        - Migration steps
        - Default values / backfill strategy
        - Rollback strategy
        - Data integrity checks
    validations:
      required: true

  - type: textarea
    id: rollout_plan
    attributes:
      label: Rollout Plan
      description: How will we deploy without breaking production?
      placeholder: |
        - Feature flag?
        - Dual-write period?
        - Cutover steps
        - Monitoring during rollout
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and Mitigations
      placeholder: |
        - Risk: ...
          Mitigation: ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria (Definition of Done)
      placeholder: |
        - Tests added/updated
        - Migration applied successfully
        - No payload drift (SDK only)
        - E2E flow verified (registration → publish)
        - Observability added (logs/metrics)
    validations:
      required: true

  - type: checkboxes
    id: guardrails
    attributes:
      label: Architecture Guardrails (must confirm)
      options:
        - label: Contract-first maintained (OpenAPI is source of truth)
          required: true
        - label: No ad-hoc payloads in web (generated SDK only)
          required: true
        - label: Tenant isolation preserved (no cross-tenant leakage)
          required: true
        - label: PDF artifacts remain deterministic via PDF service
          required: true
