name: Frontend CI

# Triggers on push and pull_request to main branches
on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend-tests:
    name: React/Vite Frontend Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Inferred from package.json and Dockerfile
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: |
          # Use npm ci for clean, reproducible installs in CI
          npm ci

      - name: Run ESLint
        working-directory: frontend
        run: |
          # Run linting
          npm run lint

      - name: Run TypeScript type checking
        working-directory: frontend
        run: |
          # Verify TypeScript types
          npx tsc --noEmit

      - name: Build production bundle
        working-directory: frontend
        run: |
          # Build the production bundle
          npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7
