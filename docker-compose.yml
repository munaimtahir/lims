

# Docker Compose configuration for LIMS application
# Optimized for SSH-based deployment on remote servers
#
# Usage:
#   Development: docker compose up
#   Production: Create .env.production with required variables, then:
#              docker compose -f docker-compose.yml up -d
#
# Environment variables required (see .env.production.example):
#   - SECRET_KEY: Django secret key
#   - DB_PASSWORD: PostgreSQL password
#   - ALLOWED_HOSTS: Comma-separated list of allowed hosts
#   - CORS_ALLOWED_ORIGINS: Comma-separated list of CORS origins

services:
  # PostgreSQL Database (Primary Data Store)
  db:
    image: postgres:16-alpine
    container_name: lims_db
    restart: unless-stopped
    volumes:
      - lims_pgdata:/var/lib/postgresql/data
      - ./backups:/var/lib/postgresql/backups:rw
    environment:
      POSTGRES_DB: ${DB_NAME:-lims_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - lims-network

  # Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: lims_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - lims-network

  # Django Backend (REST API Server)
  backend:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
      
      # For production, use pull policy
      # pull: always
    container_name: lims_backend
    restart: unless-stopped
    
    volumes:
      - static_files:/app/staticfiles
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      # Django Settings
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS in .env.production (comma-separated domains and public IP)}
      DEBUG: "False"

      # Database Configuration
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}

      # Redis Configuration
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}

      # CORS Configuration (CRITICAL: Must match frontend domain)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in .env.production (comma-separated origins)}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Define CSRF_TRUSTED_ORIGINS in .env.production (comma-separated HTTPS origins)}
      CORS_ALLOW_CREDENTIALS: "True"

      # SSL/HTTPS Configuration
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_PROXY_SSL_HEADER: "HTTP_X_FORWARDED_PROTO,https"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"

      # Email Configuration
      EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BACKUP_ROOT: ${BACKUP_ROOT:-/backups/lims}
      BACKUP_APP_NAME: ${BACKUP_APP_NAME:-lims}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-none}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lims-network

  # Celery Worker (Async Task Processing)
  celery:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
      
    container_name: lims_celery
    restart: unless-stopped
    command: celery -A config worker -l ${LOG_LEVEL:-INFO} --concurrency=4
    
    volumes:
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      # Django Settings
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS in .env.production (comma-separated domains and public IP)}

      # Database Configuration
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}

      # Redis/Celery Configuration
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_ACCEPT_CONTENT: "json"
      CELERY_TASK_SERIALIZER: "json"
      CELERY_RESULT_SERIALIZER: "json"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in .env.production (comma-separated origins)}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Define CSRF_TRUSTED_ORIGINS in .env.production (comma-separated HTTPS origins)}
      BACKUP_ROOT: ${BACKUP_ROOT:-/backups/lims}
      BACKUP_APP_NAME: ${BACKUP_APP_NAME:-lims}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-none}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lims-network

  celery-beat:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
    container_name: lims_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l ${LOG_LEVEL:-INFO}
    volumes:
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS in .env.production (comma-separated domains and public IP)}
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS in .env.production (comma-separated origins)}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Define CSRF_TRUSTED_ORIGINS in .env.production (comma-separated HTTPS origins)}
      BACKUP_ROOT: ${BACKUP_ROOT:-/backups/lims}
      BACKUP_APP_NAME: ${BACKUP_APP_NAME:-lims}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-none}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lims-network

  # React Frontend (Single Page Application)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/}
    container_name: lims_frontend
    restart: unless-stopped
    
    environment:
      # Frontend Environment Variables
      REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api/v1/}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1/}
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - lims-network

  # Caddy Reverse Proxy (Internal routing only)
  # Host Caddy handles HTTPS/SSL termination and routes to this container
  proxy:
    image: caddy:2-alpine
    container_name: lims_proxy
    restart: unless-stopped
    ports:
      # Expose on port 8012 (Host Caddy proxies to this)
      - "127.0.0.1:8012:80"
    volumes:
      # Caddy configuration file
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy data (SSL certificates)
      - caddy_data:/data
      # Caddy config
      - caddy_config:/config
      # Static files (read-only from backend)
      - static_files:/srv/static:ro
      # Media files (read-only from backend)
      - ./lims-backend/media:/srv/media:ro
    environment:
      # Internal proxy - host Caddy handles domain routing
      CADDY_DOMAIN: ${SERVER_NAME:-localhost}
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - lims-network

# Docker Networks
networks:
  lims-network:
    driver: bridge
    name: lims_network

# Docker Volumes
volumes:
  lims_pgdata:
    name: lims_pgdata
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
