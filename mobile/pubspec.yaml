name: lims_mobile
description: LIMS Mobile Application for Phase 1.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.1.0
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
  hive: ^2.2.3
