# Caddy site block for LIMS (drop into /srv/proxy/caddy/Caddyfile on the host)
# Assumes backend is served on 127.0.0.1:8000 by gunicorn/uwsgi and static/media are there too.

lims.alshifalab.pk {
	encode gzip zstd
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
		X-Frame-Options "SAMEORIGIN"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		-Server
	}

	# API/admin/static/media to backend
	@api path /api/* /admin/* /static/* /media/*
	handle @api {
		reverse_proxy 127.0.0.1:8000 {
			header_up Host {host}
			header_up X-Real-IP {remote}
		}
	}

	# Frontend / default
	handle {
		reverse_proxy 127.0.0.1:8000 {
			header_up Host {host}
			header_up X-Real-IP {remote}
		}
	}
}

api.lims.alshifalab.pk {
	encode gzip zstd
	reverse_proxy 127.0.0.1:8000 {
		header_up Host {host}
		header_up X-Real-IP {remote_host}
	}
}
