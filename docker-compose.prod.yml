# Production Compose for LIMS
# Project: prod_lims
# Data: PROD_lims_pgdata

services:
  db:
    image: postgres:16-alpine
    container_name: lims_db_prod
    restart: unless-stopped
    volumes:
      - PROD_lims_pgdata:/var/lib/postgresql/data
      - ./backups:/var/lib/postgresql/backups:rw
    environment:
      POSTGRES_DB: ${DB_NAME:-lims_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prod_lims_network

  redis:
    image: redis:7-alpine
    container_name: lims_redis_prod
    restart: unless-stopped
    volumes:
      - PROD_lims_redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - prod_lims_network

  backend:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
    container_name: lims_backend_prod
    restart: unless-stopped
    volumes:
      - PROD_lims_static_files:/app/staticfiles
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: "True"
      # ... other envs are usually in .env file which compose picks up automatically
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - prod_lims_network

  celery:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
    container_name: lims_celery_prod
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=4
    volumes:
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_lims_network

  celery-beat:
    build:
      context: ./lims-backend
      dockerfile: Dockerfile
    container_name: lims_celery_beat_prod
    restart: unless-stopped
    command: celery -A config beat -l INFO
    volumes:
      - ./lims-backend/media:/app/media:rw
      - ./backups:/backups:rw
      - ./logs:/app/logs:rw
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-lims_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prod_lims_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lims_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - prod_lims_network

  proxy:
    image: caddy:2-alpine
    container_name: lims_proxy_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8012:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - PROD_lims_caddy_data:/data
      - PROD_lims_caddy_config:/config
      - PROD_lims_static_files:/srv/static:ro
      - ./lims-backend/media:/srv/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - prod_lims_network

networks:
  prod_lims_network:
    name: prod_lims_network

volumes:
  PROD_lims_pgdata:
    name: PROD_lims_pgdata
  PROD_lims_redis_data:
    name: PROD_lims_redis_data
  PROD_lims_static_files:
    name: PROD_lims_static_files
  PROD_lims_caddy_data:
    name: PROD_lims_caddy_data
  PROD_lims_caddy_config:
    name: PROD_lims_caddy_config
